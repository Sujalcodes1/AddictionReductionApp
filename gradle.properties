# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m

# Point to the correct JDK (Android Studio's bundled JBR — valid for AGP 8.7.3 / Kotlin 2.x)
org.gradle.java.home=D:\\Android\\jbr

# Use default Gradle home unless specifically needed
# systemProp.gradle.user.home=D:/gradle_new_home
# org.gradle.user.home=D:/gradle_new_home

# Disable file watching and configuration cache to fix AccessDeniedException on Windows
org.gradle.vfs.watch=false
org.gradle.vfs.retention=false
org.gradle.configuration-cache=false
org.gradle.daemon=true

# Explicitly set android user home to avoid conflicts (Commented out - let it use default)
# systemProp.ANDROID_USER_HOME=C:/Users/patha/.android

org.gradle.parallel=false
org.gradle.caching=false
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Allow building with API 36
android.suppressUnsupportedCompileSdk=36


